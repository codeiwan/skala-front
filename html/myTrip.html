<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 여행지</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="container">
    <h1>🌍 나의 여행 앨범 🎵</h1>
    <audio controls>
      <source src="../media/music.mp3" type="audio/mpeg">
      Your browser does not support the audio element.
    </audio>
  
    <hr>
  
    <div class="trip-grid-container">
      <p class="trip-card">
        <img src="../media/리장.jpg" width="400" alt="리장 호도협"><br>
        리장 호도협 (2025년)
      </p>
      <p class="trip-card">
        <img src="../media/세부.jpg" width="400" alt="세부 탑스힐"><br>
        세부 탑스힐 (2024년)
      </p>
      <p class="trip-card">
        <img src="../media/홋카이도.jpg" width="400" alt="홋카이도 대설산"><br>
        홋카이도 대설산 (2025년)
      </p>
    </div>

    <hr>
    
    <h2>나의 여행 브이로그</h2>
    <div>
      <p>
        <video width="400" controls>
          <source src="../media/video.mp4" type="video/mp4">
          Your browser does not support the video tag.
        </video>
        <br>
        리장의 아름다운 음악
      </p>
    </div>
  </div>
</body>
</html>
