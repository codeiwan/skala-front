<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="container">
    <h2>회원가입</h2>
    <p>SKALA-FRONT 회원가입을 환영합니다.</p>

    <hr>
    
    <form action="signUpResult.html" method="get">
      <fieldset>
        <legend>계정 정보</legend>
        <p>
          <label for="userId">아이디: </label>
          <input type="text" id="userId" name="userId" minlength="4" maxlength="20" required placeholder="4~20자 사이의 아이디 입력">
          <small>(필수)</small>
        </p>
        <p>
          <label for="userPw">비밀번호: </label>
          <input type="password" id="userPw" name="userPw" minlength="8" required placeholder="8자 이상 입력">
          <small>(필수)</small>
        </p>
        <p>
          <label for="userEmail">이메일: </label>
          <input type="text" id="userEmail" name="userEmail" required placeholder="example">
          @
          <select name="userEmailDomain" id="userEmailDomain" required>
            <option value="" disabled selected>선택</option>
            <option value="naver.com">naver.com</option>
            <option value="gmail.com">gmail.com</option>
            <option value="daum.net">daum.net</option>
            <option value="nate.com">nate.com</option>
          </select>
        </p>
      </fieldset>
      
      <br>
  
      <fieldset>
        <legend>개인 프로필 정보</legend>
        <p>
          <label for="userName">이름: </label>
          <input type="text" id="userName" name="userName" required>
        </p>
        <p>
          <label for="userBirth">생년월일: </label>
          <input type="date" id="userBirth" name="userBirth">
        </p>
        <p>
          성별: 
          <label><input type="radio" name="gender" value="male"> 남성</label>
          <label><input type="radio" name="gender" value="female"> 여성</label>
          <label><input type="radio" name="gender" value="none" checked> 선택안함</label>
        </p>
        <p>
          관심 분야 (중복 선택 가능):<br>
          <label><input type="checkbox" name="interest" value="frontend"> 웹 프론트엔드 (Vue.js/HTML)</label><br>
          <label><input type="checkbox" name="interest" value="uiux"> UI/UX 디자인 표준</label><br>
          <label><input type="checkbox" name="interest" value="backend"> 백엔드 & 데이터베이스</label><br>
          <label><input type="checkbox" name="interest" value="devops"> 클라우드 & 인프라</label><br>
        </p>
        <p>
          <label for="joinPath">가입경로: </label>
          <select id="joinPath" name="joinPath">
            <option value="" disabled selected>-- 선택해 주세요 --</option>
            <option value="search">인터넷 검색</option>
            <option value="friend">지인 추천</option>
            <option value="sns">SNS 광고</option>
            <option value="etc">기타</option>
          </select>
        </p>
      </fieldset>
  
      <br>
      
      <fieldset>
        <legend>자기소개</legend>
        <p>
          <label for="intro">나를 표현하는 한 줄 소개 또는 가입 인사:</label><br>
          <textarea id="intro" name="intro" rows="5" cols="50" maxlength="200" placeholder="여기에 내용을 입력하세요 (최대 200자)"></textarea>
        </p>
      </fieldset>
  
      <br>
  
      <fieldset>
        <legend>약관 동의</legend>
        <p>
          <label><input type="checkbox" name="terms" required> <strong>[필수]</strong> 이용약관에 동의합니다.</label>
        </p>
        <p>
          <label><input type="checkbox" name="privacy" required> <strong>[필수]</strong> 개인정보 처리방침에 동의합니다.</label>
        </p>
        <p>
          <label><input type="checkbox" name="marketing"> [선택] 마케팅 정보 수신에 동의합니다.</label>
        </p>
      </fieldset>
  
      <br>
  
      <input type="submit" class="btn-submit" value="동의하고 회원가입">
      <input type="reset" class="btn-reset" value="다시 작성">
    </form>
  </div>
</body>
</html>
